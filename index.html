<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Witches Realm</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0716;
      font-family: 'Cinzel', serif, Georgia, 'Times New Roman', Times;
    }

    .hero-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Video background styling */
    .bg-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.8s ease;
      z-index: 1;
    }

    /* Invisible click zone directly over the 'Summon Trouble' button */
    .summon-trigger {
      position: absolute;
      bottom: 5.5%;
      left: 50%;
      transform: translateX(-50%);
      width: 260px;
      height: 50px;
      background: transparent;
      border: 2px solid transparent;
      border-radius: 4px;
      cursor: pointer;
      z-index: 10;
      outline: none;
      transition: box-shadow 0.3s ease, border-color 0.3s ease;
    }

    .summon-trigger:hover {
      border-color: rgba(192, 132, 252, 0.6);
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.8), inset 0 0 10px rgba(168, 85, 247, 0.4);
    }

    /* Purple burst overlay */
    .orb-flash {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 65%, #c084fc 0%, rgba(11, 7, 22, 0.85) 60%);
      opacity: 0;
      pointer-events: none;
      z-index: 15;
      transition: opacity 0.7s ease;
    }

    /* Manuscript modal */
    .manuscript-modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      width: min(580px, 90vw);
      padding: 40px;
      background: #eadebe;
      border: 3px double #58331d;
      border-radius: 6px;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(168, 85, 247, 0.6);
      opacity: 0;
      pointer-events: none;
      z-index: 20;
      text-align: center;
      color: #2b1d0c;
      transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .manuscript-modal h2 {
      font-size: 2rem;
      margin-bottom: 14px;
      letter-spacing: 2px;
    }

    .manuscript-modal p {
      font-size: 1.1rem;
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .start-btn {
      background: #381a4a;
      border: 1px solid #c084fc;
      color: #f3e8ff;
      padding: 10px 24px;
      font-size: 1rem;
      letter-spacing: 1px;
      cursor: pointer;
      border-radius: 4px;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .start-btn:hover {
      background: #582177;
      transform: scale(1.05);
    }

    /* Zoom into the crystal ball on click */
    .zoom-in-ball .bg-layer {
      transform: scale(2.6) translateY(12%);
      filter: blur(3px);
    }

    .zoom-in-ball .orb-flash {
      opacity: 0.85;
    }

    .manuscript-modal.active {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }
  </style>
</head>
<body>

<div class="hero-container" id="hero">
  <video class="bg-layer" id="bgMedia" autoplay muted loop playsinline>
    <source src="witches_bg.mp4" type="video/mp4" />
    Your browser does not support the video tag.
  </video>

  <button id="summonBtn" class="summon-trigger" title="Click to summon"></button>

  <div id="orbFlash" class="orb-flash"></div>

  <div id="manuscriptModal" class="manuscript-modal">
    <h2>Welcome, Adventurer</h2>
    <p>The incantation has begun. Darkness stirs within the crystal glass...</p>
    <button class="start-btn">Enter the Realm</button>
  </div>
</div>

<script>
  const summonBtn = document.getElementById('summonBtn');
  const hero = document.getElementById('hero');
  const manuscript = document.getElementById('manuscriptModal');

  summonBtn.addEventListener('click', () => {
    summonBtn.style.pointerEvents = 'none';
    hero.classList.add('zoom-in-ball');

    setTimeout(() => {
      manuscript.classList.add('active');
    }, 450);
  });
</script>

</body>
</html>
